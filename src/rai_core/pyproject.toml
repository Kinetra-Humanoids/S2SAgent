[project]
name = "rai_core"
version = "2.12.0"
description = "Core functionality for RAI framework"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Maciej Majek", email = "maciej.majek@robotec.ai" },
    { name = "Bartlomiej Boczek", email = "bartlomiej.boczek@robotec.ai" },
    { name = "Kajetan Rachwal", email = "kajetan.rachwal@robotec.ai" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "langchain-core>=1.2.10,<2.0.0",
    "langgraph>=1.1.5,<2.0.0",
    "langgraph-prebuilt",
    "langchain-openai",
    "requests>=2.32.2,<3.0.0",
    "coloredlogs>=15.0.1,<16.0.0",
    "tomli>=2.0.1,<3.0.0",
    "tomli-w>=1.1.0,<2.0.0",
    "pillow>=11.0.0,<12.0.0",
    "pydub>=0.25.1,<0.26.0",
    "numpy<2.0",
]

[project.optional-dependencies]
aws = ["langchain-aws"]
google = ["langchain-google-genai"]
ollama = ["langchain-ollama"]
tracing = ["langfuse>=3.8.0,<4.0.0"]

[project.scripts]
rai-config-init = "rai.initialization.config_initialization:main"

[tool.uv.build-backend]
module-root = ""
module-name = "rai"

[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"
